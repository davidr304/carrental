<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <style>
        /* Confirmation Page Specific Styles */
        .confirmation-container {
            padding: 80px 0;
            text-align: center;
        }
        
        .confirmation-icon {
            font-size: 80px;
            color: #2ecc71;
            margin-bottom: 30px;
        }
        
        .confirmation-title {
            font-size: 36px;
            color: var(--dark);
            margin-bottom: 20px;
        }
        
        .confirmation-subtitle {
            font-size: 20px;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto 40px;
        }
        
        .confirmation-card {
            background-color: white;
            border-radius: 8px;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: left;
        }
        
        .confirmation-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }
        
        @media (max-width: 768px) {
            .confirmation-details {
                grid-template-columns: 1fr;
            }
        }
        
        .detail-section h3 {
            font-size: 18px;
            color: var(--dark);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .detail-label {
            font-weight: 600;
            color: var(--gray);
        }
        
        .detail-value {
            color: var(--dark);
            text-align: right;
        }
        
        .total-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--secondary);
            margin-top: 10px;
        }
        
        .car-summary-confirm {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .car-image-confirm {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .car-info-confirm h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .confirmation-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .btn-print, .btn-download, .btn-home {
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-print {
            background-color: var(--primary);
            color: white;
            border: none;
        }
        
        .btn-print:hover {
            background-color: #1a252f;
        }
        
        .btn-download {
            background-color: #3498db;
            color: white;
            border: none;
        }
        
        .btn-download:hover {
            background-color: #2980b9;
        }
        
        .btn-home {
            background-color: #2ecc71;
            color: white;
            border: none;
        }
        
        .btn-home:hover {
            background-color: #27ae60;
        }
        
        .confirmation-notice {
            background-color: #e8f4fc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 4px solid #3498db;
        }
        
        .confirmation-notice h4 {
            color: #2980b9;
            margin-bottom: 10px;
        }
        
        .payment-proof {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .tx-id {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            word-break: break-all;
        }
        
        @media print {
            header, footer, .confirmation-actions {
                display: none;
            }
            
            .confirmation-container {
                padding: 20px 0;
            }
            
            .confirmation-card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>

    <script>
        // Confirmation Page Logic
        document.addEventListener('DOMContentLoaded', function() {
            // Load booking data
            const bookingData = JSON.parse(localStorage.getItem('bookingData'));
            
            if (!bookingData || !bookingData.paymentStatus || bookingData.paymentStatus !== 'completed') {
                // Redirect to home if no valid booking data
                window.location.href = 'index.html';
                return;
            }
            
            // Initialize confirmation page
            initConfirmationPage(bookingData);
            
            // Mobile menu toggle
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mainNav = document.getElementById('mainNav');
            
            if (mobileMenuBtn && mainNav) {
                mobileMenuBtn.addEventListener('click', () => {
                    mainNav.classList.toggle('active');
                });
            }
            
            // Download PDF button
            document.getElementById('downloadPdf').addEventListener('click', function() {
                alert('PDF download would start in a real implementation. For now, use the print function.');
            });
        });
        
        function initConfirmationPage(bookingData) {
            // Update car details
            const car = getCarById(parseInt(bookingData.carId));
            document.getElementById('confirmCarImage').src = car.image;
            document.getElementById('confirmCarName').textContent = bookingData.carName;
            document.getElementById('confirmRentalPeriod').textContent = `${bookingData.rentalDays} days`;
            document.getElementById('confirmRentalDays').textContent = `${bookingData.rentalDays} days`;
            
            // Format dates
            const pickupDate = new Date(bookingData.pickupDate);
            const returnDate = new Date(bookingData.returnDate);
            const bookingDate = new Date(bookingData.paymentTime || new Date());
            
            document.getElementById('confirmPickupDate').textContent = formatDate(pickupDate);
            document.getElementById('confirmReturnDate').textContent = formatDate(returnDate);
            document.getElementById('confirmBookingDate').textContent = formatDate(bookingDate);
            
            // Update booking details
            document.getElementById('confirmBookingId').textContent = bookingData.bookingId;
            document.getElementById('confirmPickupLocation').textContent = 'Main Office, City';
            
            // Update payment details
            const paymentMethod = bookingData.paymentMethod === 'crypto' ? 'Cryptocurrency (BTC)' : 
                                 bookingData.paymentMethod === 'credit_card' ? 'Credit Card' : 'PayPal';
            document.getElementById('confirmPaymentMethod').textContent = paymentMethod;
            document.getElementById('confirmPaymentStatus').textContent = 'Completed';
            document.getElementById('confirmTransactionId').textContent = bookingData.transactionId || 'N/A';
            
            // Format payment time
            if (bookingData.paymentTime) {
                const paymentTime = new Date(bookingData.paymentTime);
                document.getElementById('confirmPaymentTime').textContent = 
                    paymentTime.toLocaleString('en-US', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        timeZoneName: 'short'
                    });
            }
            
            // Update price summary
            document.getElementById('confirmBasePrice').textContent = bookingData.basePrice.toFixed(2);
            document.getElementById('confirmInsurancePrice').textContent = bookingData.insurancePrice.toFixed(2);
            document.getElementById('confirmServiceFee').textContent = bookingData.serviceFee.toFixed(2);
            document.getElementById('confirmTaxes').textContent = bookingData.taxes.toFixed(2);
            document.getElementById('confirmTotal').textContent = bookingData.total.toFixed(2);
            
            // Calculate add-ons total
            let addonsTotal = 0;
            if (bookingData.addons && bookingData.addons.length > 0) {
                bookingData.addons.forEach(addon => {
                    addonsTotal += addon.total;
                });
            }
            document.getElementById('confirmAddonsPrice').textContent = addonsTotal.toFixed(2);
            
            // Update discount if any
            const discountItem = document.getElementById('confirmDiscountItem');
            if (bookingData.discountAmount > 0) {
                discountItem.style.display = 'flex';
                document.getElementById('confirmDiscount').textContent = bookingData.discountAmount.toFixed(2);
            } else {
                discountItem.style.display = 'none';
            }
            
            // Update customer info
            document.getElementById('confirmCustomerName').textContent = `${bookingData.firstName} ${bookingData.lastName}`;
            document.getElementById('confirmCustomerEmail').textContent = bookingData.email;
            document.getElementById('confirmCustomerPhone').textContent = bookingData.phone;
            document.getElementById('confirmLicense').textContent = bookingData.licenseNumber;
        }
        
        function formatDate(date) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }
    </script>
